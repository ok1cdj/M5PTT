; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = atoms3-lite

[env:atoms3-lite]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 80000000L
build_flags =
    -DUSE_TINYUSB=1
    ; AtomS3 board defaults to ARDUINO_USB_MODE=1 (HW serial/JTAG); USB MIDI
    ; needs OTG/TinyUSB mode (=0). build_flags win over board extra_flags.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit TinyUSB Library@^3.3.4
    fortyseveneffects/MIDI Library@^5.0.2
    https://github.com/lathoub/Arduino-BLE-MIDI.git
    fastled/FastLED@^3.7.0
