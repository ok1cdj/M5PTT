name: Build firmware & deploy install page

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel an in-progress release.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e atoms3-lite

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          # Version from the tag (v1.2.3 -> 1.2.3); "dev" for manual runs.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "Publishing firmware version: ${VERSION}"

          rm -rf _site
          mkdir -p _site/firmware
          # Static assets: index.html, manual.html, manifest.json, CNAME, ...
          cp docs/*.html docs/manifest.json docs/CNAME _site/
          cp .pio/build/atoms3-lite/firmware.factory.bin _site/firmware/

          # Stamp the version into the published manifest.
          jq --arg v "${VERSION}" '.version = $v' _site/manifest.json > _site/manifest.tmp
          mv _site/manifest.tmp _site/manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
